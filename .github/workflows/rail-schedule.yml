name: Jadwal kereta

# Jadwal pasti KRL / MRT / LRT / KA Bandara → data/rail_schedule.json (dipakai mesin rute untuk
# waktu tunggu & lama perjalanan yang pasti). Sumber diatur lewat variabel repo (Settings → Variables):
#   COMULINE_API  mis. https://www.api.comuline.com/v1   (jadwal KRL harian dari KAI Commuter)
#   RAIL_GTFS     mis. MRT=https://…/gtfs.zip,LRTJ=https://…/gtfs.zip   (stop_times GTFS statis)
# Tanpa sumber, langkah ini tidak mengubah apa pun dan aplikasi memakai perkiraan headway.
on:
  schedule:
    - cron: "43 19 * * *"     # 02.43 WIB
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/rail_schedule.py", ".github/workflows/rail-schedule.yml"]
permissions:
  contents: write
concurrency:
  group: rail-schedule
  cancel-in-progress: false
jobs:
  schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Bangun jadwal
        env:
          COMULINE_API: ${{ vars.COMULINE_API }}
          RAIL_GTFS: ${{ vars.RAIL_GTFS }}
        run: |
          set +e
          if [ -z "$COMULINE_API$RAIL_GTFS" ]; then echo "::notice::Belum ada sumber jadwal (COMULINE_API / RAIL_GTFS)"; exit 0; fi
          python3 tools/rail_schedule.py 2> "$RUNNER_TEMP/rail.err"
          code=$?
          if [ -s "$RUNNER_TEMP/rail.err" ]; then while IFS= read -r l; do echo "::warning title=rail_schedule::$l"; done < "$RUNNER_TEMP/rail.err"; fi
          [ $code -eq 0 ] || echo "::warning::jadwal tidak diperbarui (kode $code); berkas lama dipertahankan"
          exit 0
      - name: Periksa & commit
        run: |
          python3 tools/rail_schedule.py --check
          git config user.name "lumi-route-watch[bot]"
          git config user.email "lumi-route-watch@users.noreply.github.com"
          git add data/rail_schedule.json
          git diff --cached --quiet || (git commit -qm "data: jadwal kereta" && git pull -q --rebase origin main && git push origin HEAD:main)
