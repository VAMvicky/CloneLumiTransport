name: Pantau perubahan rute

# Mengecek GTFS resmi Transjakarta tiap jam. Bila ada rute yang berubah, data/route_changes.json
# diperbarui; aplikasi membaca file ini tiap jam dan langsung memberi notifikasi.
on:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [ main ]
    paths: [ "tools/route_watch.py", ".github/workflows/route-watch.yml" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: route-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Cek GTFS resmi
        run: |
          # Catat status (berhasil / gagal) ke data/watch_status.json agar terlihat tanpa membuka log.
          if python3 tools/route_watch.py --data data --save-zip "$RUNNER_TEMP/gtfs.zip" 2> err.txt; then
            printf '{\n "ok": true\n}\n' > data/watch_status.json
          else
            python3 -c "import json;print(json.dumps({'ok':False,'error':open('err.txt').read()[-600:]},indent=1))" > data/watch_status.json
          fi

      # Catatan: langkah "Ringkasan GTFS untuk aplikasi" (cabang gtfs-data) dibuang di v2.21.
      # Langkah itu menjalankan `javac` pada GtfsImporter.java saja, padahal berkas itu memakai
      # Csv/Lang/AppInfo — kelas Android. Hasilnya selalu "cannot find symbol", `set -e` mematikan
      # job sebelum langkah "Simpan perubahan", jadi data/route_changes.json tidak pernah diperbarui.
      # Ringkasan GTFS di HP sudah dikerjakan GtfsImporter di dalam aplikasi, jadi cabang itu mati.

      - name: Simpan perubahan
        run: |
          git config user.name "lumi-route-watch[bot]"
          git config user.email "lumi-route-watch@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
          else
            git commit -m "data: pembaruan rute $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
