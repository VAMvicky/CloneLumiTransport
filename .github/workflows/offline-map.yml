name: Peta offline

# v2.17: membangun paket peta offline Jabodetabek (OpenStreetMap → Planetiler → PMTiles + gaya Liberty)
# dan menaruhnya di rilis "peta-offline" (pre-release, tidak menjadi rilis terbaru aplikasi).
# Aplikasi mengunduh peta-jabodetabek.json lalu peta-jabodetabek.zip dari rilis itu (OfflineMap.java).
on:
  workflow_dispatch:
  schedule:
    - cron: "17 19 1 * *"     # tiap tanggal 1, 02.17 WIB: data OSM terbaru

permissions:
  contents: read

concurrency:
  group: offline-map
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write          # unggah ke rilis "peta-offline"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Unduh Planetiler
        env:
          PLANETILER_VERSION: "0.9.3"
        run: |
          set -euo pipefail
          mkdir -p build/map
          curl -fsSL --retry 4 -o build/planetiler.jar \
            "https://github.com/onthegomap/planetiler/releases/download/v${PLANETILER_VERSION}/planetiler.jar"
          java -jar build/planetiler.jar --help >/dev/null 2>&1 || true
          ls -la build/planetiler.jar

      - name: Bangun paket peta
        run: python3 tools/build_offline_map.py build/planetiler.jar build/map

      - name: Periksa paket
        run: |
          set -euo pipefail
          pip install --quiet pmtiles==3.8.1
          python3 tools/check_offline_map.py build/map/peta-jabodetabek.zip

      - name: Unggah ke rilis "peta-offline"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd build/map
          NOTES="Paket peta offline Jabodetabek untuk Lumi Transport (diunduh dari dalam aplikasi: Pengaturan → Peta offline). Data © OpenStreetMap contributors (ODbL), dibangun dengan Planetiler; gaya OpenFreeMap Liberty © OpenMapTiles. Diperbarui $(date -u +%Y-%m-%d)."
          if ! gh release view peta-offline >/dev/null 2>&1; then
            gh release create peta-offline --prerelease --latest=false --title "Peta offline Jabodetabek" --notes "$NOTES" \
              peta-jabodetabek.zip peta-jabodetabek.json
          else
            # Zip dulu, manifest terakhir: aplikasi yang membaca manifest baru selalu mendapat zip yang cocok.
            gh release upload peta-offline peta-jabodetabek.zip --clobber
            gh release upload peta-offline peta-jabodetabek.json --clobber
            gh release edit peta-offline --notes "$NOTES" --prerelease
          fi
          gh release view peta-offline --json assets --jq '.assets[] | "\(.name) \(.size)"'
