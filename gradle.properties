org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true

# Versi klien aplikasi resmi Transjakarta yang dikirim Lumi di header x-app-version (feed bus & REST TJ).
# SATU-SATUNYA tempat angka ini ditulis: dibaca app/build.gradle (BuildConfig.TJ_CLIENT_VERSION) dan
# tools/gen_build_info.py (js/build.js). Bila TJ menaikkan versi minimum klien sebelum rilis berikutnya,
# naikkan "tjClientVersion" di data/remote_config.json — aplikasi yang sudah terpasang ikut memakainya.
lumi.tjClientVersion=2.11.0
