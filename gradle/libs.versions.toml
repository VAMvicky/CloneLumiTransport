# Version catalog tunggal untuk semua repo Lumi.
# Naikkan versi di sini, lalu Dependabot/PR yang menguji perubahannya.
[versions]
agp = "8.5.2"
profileinstaller = "1.3.1"
junit = "4.13.2"
orgjson = "20240303"

[libraries]
androidx-profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "profileinstaller" }
# v2.17: uji unit Java (app/src/test). org.json asli menggantikan stub android.jar saat uji di JVM.
junit = { module = "junit:junit", version.ref = "junit" }
org-json = { module = "org.json:json", version.ref = "orgjson" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
